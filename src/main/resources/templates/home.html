<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - MyCustomAuth</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #333; }
        .success-text { color: #5cb85c; font-size: 18px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome, <span th:text="${username}">User</span>! 👋</h1>
    <p class="success-text">You have successfully logged in.</p>
</div>

</body>
</html>
